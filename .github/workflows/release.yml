name: Release CI/CD Platform Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci
          pip install numpy pillow

      - name: Compile TypeScript & Vite Production Bundle
        run: npm run build

      - name: Run Complete Test Suite
        run: npx vitest run

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-client
          path: dist/
          retention-days: 1

  package-cross-platform:
    name: Package ${{ matrix.platform.name }}
    needs: build-and-test
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows-x64
            os: windows-latest
            artifact: apex-grand-prix-windows-x64.zip
          - name: macOS-Universal
            os: macos-latest
            artifact: apex-grand-prix-macos-universal.zip
          - name: Linux-x86_64
            os: ubuntu-latest
            artifact: apex-grand-prix-linux-x86_64.tar.gz
          - name: Mobile-PWA
            os: ubuntu-latest
            artifact: apex-grand-prix-pwa-standalone.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci
          pip install numpy pillow

      - name: Build Assets & Client Bundle
        run: |
          npm run build
          node tools/package_release.mjs

      - name: Bundle Windows Native Installer Package
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "release/apex-grand-prix-offline.zip" "${{ matrix.platform.artifact }}"
          Get-FileHash "${{ matrix.platform.artifact }}" -Algorithm SHA256 > "${{ matrix.platform.artifact }}.sha256"

      - name: Bundle macOS Application Package
        if: matrix.platform.os == 'macos-latest'
        run: |
          cp release/apex-grand-prix-offline.zip "${{ matrix.platform.artifact }}"
          shasum -a 256 "${{ matrix.platform.artifact }}" > "${{ matrix.platform.artifact }}.sha256"

      - name: Bundle Linux Standalone Binary Package
        if: matrix.platform.os == 'ubuntu-latest' && matrix.platform.name == 'Linux-x86_64'
        run: |
          tar -czf "${{ matrix.platform.artifact }}" -C dist .
          sha256sum "${{ matrix.platform.artifact }}" > "${{ matrix.platform.artifact }}.sha256"

      - name: Bundle Progressive Web App (PWA) Distribution
        if: matrix.platform.name == 'Mobile-PWA'
        run: |
          cp release/apex-grand-prix-web-pwa.zip "${{ matrix.platform.artifact }}"
          sha256sum "${{ matrix.platform.artifact }}" > "${{ matrix.platform.artifact }}.sha256"

      - name: Upload Platform Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: |
            ${{ matrix.platform.artifact }}
            ${{ matrix.platform.artifact }}.sha256
          retention-days: 7

  publish-github-release:
    name: Publish GitHub Release
    needs: package-cross-platform
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
