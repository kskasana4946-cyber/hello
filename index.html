<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apex GP" />
  <meta name="theme-color" content="#020617" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <title>Apex Grand Prix: Uncapped Next-Gen Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 1;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #020617;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #fff;
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #orientation-warning {
        display: flex !important;
      }
    }
  </style>
</head>
<body>
  <div id="orientation-warning">
    <div style="font-size: 54px; margin-bottom: 16px; animation: spin-gentle 3s ease-in-out infinite;">🔄</div>
    <div style="font-size: 22px; font-weight: 900; letter-spacing: 1.5px; color: #00f0ff; text-transform: uppercase;">
      Rotate Device to Landscape
    </div>
    <div style="font-size: 14px; color: #94a3b8; margin-top: 10px; max-width: 320px; line-height: 1.5;">
      Apex Grand Prix requires a horizontal screen for maximum racing visibility and dual-thumb controls.
    </div>
  </div>

  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay"></div>
  </div>

  <script>
    // Register Service Worker for Offline PWA Play
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
  <script type="module" src="/src/ui/TouchControls.ts"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
